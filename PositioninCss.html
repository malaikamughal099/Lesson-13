<!DOCTYPE html>
<html>

<head>
    <title>The Positioning in Css </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightyellow;
            padding: 65px 30px 30px 30px;
            min-height: 1800px;
        }

        h1,
        h2 {
            color: darkorange;
        }

        .top-bar {
            position: fixed;
            top: 0%;
            left: 0%;
            right: 0%;
            background-color: darkorange;
            color: white;
            padding: 14px 20px;
        }

        .list-item {
            background-color: white;
            border: 2px solid darkorange;
            padding: 10px 20px;
            margin: 5px 0;
        }

        .special-note {
            position: relative;
            background-color: gold;
            left: 30px;
            padding: 10px 20px;
        }

        .pet-card {
            position: relative;
            background-color: white;
            border: 3px solid darkorange;
            padding: 15px 25px;
        }

        .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: forestgreen;
            color: white;
            padding: 4px 8px;
        }
    </style>
</head>

<body>
    <div class="top bar">My Pet Page - Buddy the Labrador</div>
    <h1>Meet Buddy!</h1>

    <h2>Static</h2>
    <div class="list-item">Breed: Labrador</div>
    <div class="list-item">Age:2 years old</div>

    <h2>Relative</h2>
    <p>This note shifts right from its normalspot.</p>
    <div class="special-note">Pet of the Month!</div>

    <h2>Absolute</h2>
    <p>The badge is pinnedto the corner of the card.</p>
    <div class="pet-card">
        <p>Buddy - Labrador , 2 years</p>
        <div class="badge">Adopted</div>
    </div>

</body>

</html>
